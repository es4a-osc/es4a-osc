<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<title>ES4A</title>
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
	<meta name="description" content="安卓应用开发工具" />
	<meta name="keywords" content="e,vb,es4a,simple,android,安卓,中文编程" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<link rel="icon" href="static/image/favicon.ico" type="image/x-icon" />
	<!-- docsify主题(基于 https://cdn.jsdelivr.net/npm/docsify@4.11.3/themes/vue.css 优化而来) -->
	<link rel="stylesheet" href="static/css/vue.css" />
</head>
<body>
	<!-- 绑定元素 -->
	<div id="app">🚀 正在加载文档中...</div>

	<!-- docsify文档定义 -->
	<script>
	window.$docsify = {
		// 文档名称
		name: "ES4A",
		// 文档加载的根路径，可以是二级路径或者是其他域名的路径
		// 这里用相对路径，让文档支持在子仓库页中可正常显示
		basePath: "./docs/",
		// 启用相对路径
		relativePath: false,
		// 启用封面；加载 _coverpage.md
		coverpage: true,
		// 定制导航栏，加载 _navbar.md
		loadNavbar: true,
		// 定制侧边栏；加载 _sidebar.md
		loadSidebar: true,
		// 定制404页面，加载 _404.md
		notFoundPage: true,
		// 切换页面后是否自动跳转到页面顶部
		auto2top: true,
		// 正式文档不执行 Markdown 中的试验脚本
		executeScript: false,
		// 小屏设备下合并导航栏到侧边栏
		mergeNavbar: true,
		// 最大支持渲染的标题层级
		maxLevel: 4,
		// 生成目录(侧边栏)的最大层级
		subMaxLevel: 2,
		// 定义路由别名，可以更自由的定义路由规则。支持正则。
		alias: {
			// 解决因浏览目录中文档时，会自动请求目录下的 _navbar.md _sidebar.md
			"/.*/_navbar.md": "/_navbar.md",
			"/.*/_sidebar.md": "/_sidebar.md"
		},
		/* 插件配置项 */

		// 全文搜索/search
		search: {
			// 过期时间，单位毫秒，默认一天
			maxAge: 0,
			// 路径
			paths: [
				"/CHANGELOG",
				"/README",
				"/ROADMAP",
				"/library/README",
				"/library/build",
				"/library/java",
				"/library/manifests",
				"/library/sdk",
				"/project/README",
				"/project/runtime",
				"/project/build",
				"/project/designer",
				"/project/environment",
				"/project/faq",
				"/project/syntax",
				"/project/extensions",
				"/project/operations",
				"/project/quickstart"
			],
			// 搜索提示
			placeholder: "搜索文档",
			// 未搜索到显示
			noData: "没有找到相关内容",
			// 搜索标题的最大程级，1 - 6
			depth: 4,
			namespace: "es4a-docs-20261009-slim"
		},
		// 复制代码到剪贴板/docsify-copy-code
		copyCode: {
			buttonText : '复制',
			errorText  : '错误',
			successText: '复制'
		},
	}
	</script>

	<!-- 基础依赖 -->

	<!-- Docsify核心(https://github.com/docsifyjs/docsify) -->
	<script src="https://cdn.bootcdn.net/ajax/libs/docsify/4.13.1/docsify.min.js"></script>

	<!-- Docsify官方插件 -->

	<!-- 本地搜索摘要适配，先于搜索插件加载 -->
	<script src="static/js/search-text.js"></script>
	<!-- 全文搜索(https://github.com/docsifyjs/docsify/tree/develop/src/plugins/search) -->
	<script src="https://cdn.bootcdn.net/ajax/libs/docsify/4.13.1/plugins/search.min.js"></script>
	<!-- 图片缩放(https://github.com/docsifyjs/docsify/tree/develop/src/plugins) -->
	<script src="https://cdn.bootcdn.net/ajax/libs/docsify/4.13.1/plugins/zoom-image.min.js"></script>

	<!-- Docsify第三方插件 -->

	<!-- 复制代码到剪贴板(https://github.com/jperasmus/docsify-copy-code) -->
	<script src="https://cdn.bootcdn.net/ajax/libs/docsify-copy-code/3.0.0/docsify-copy-code.min.js"></script>

	<!-- Prism代码高亮 -->

	<!-- Prism核心 -->
	<script src="https://cdn.bootcdn.net/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
	<!-- INI -->
	<script src="https://cdn.bootcdn.net/ajax/libs/prism/1.29.0/components/prism-ini.min.js"></script>
	<!-- JSON -->
	<script src="https://cdn.bootcdn.net/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
	<!-- Java -->
	<script src="https://cdn.bootcdn.net/ajax/libs/prism/1.29.0/components/prism-java.min.js"></script>
	<!-- Simple 本地自定义实现(基于 https://cdn.jsdelivr.net/npm/prismjs@1.20.0/components/prism-visual-basic.js 修改而来) -->
	<script src="static/js/prism-simple.js"></script>
</body>
</html>
